name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:rules
      - run: pnpm test:migrations
      - run: pnpm test:console
        env:
          CONSOLE_UI: skip
      - run: pnpm build
      # Rehearses updating a live client (backup, data updates, deploy order) with Google simulated.
      - run: pnpm test:update
      - run: pnpm build:console
